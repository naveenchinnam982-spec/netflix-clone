# Netlify configuration for Next.js (App Router)
# Uses the official Netlify Next.js runtime plugin so Server Components,
# Route Handlers (/api/*) and middleware all work in production.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
